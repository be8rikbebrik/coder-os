# ==============================================================================
# CODER-OS Hyprland Configuration
# ==============================================================================

# Monitor configuration (Auto-detect resolution & refresh rate for laptops and external screens)
monitor=,preferred,auto,1

# Autostart essential services and CODER-OS Wizard
exec-once = waybar &
exec-once = swaybg -c "#0b0f19" &
exec-once = dunst &
exec-once = /usr/bin/coder-setup &

# Input settings (Optimized for laptops: tap to click, natural scroll)
input {
    kb_layout = us,ru
    kb_options = grp:win_space_toggle
    follow_mouse = 1
    touchpad {
        natural_scroll = true
        tap-to-click = true
        drag_lock = true
    }
    sensitivity = 0
}

# General aesthetics
general {
    gaps_in = 5
    gaps_out = 10
    border_size = 2
    col.active_border = rgba(38bdf8ee) rgba(0284c7ee) 45deg
    col.inactive_border = rgba(1e293baa)
    layout = dwindle
}

# Decoration (Glow, round corners, slight blur)
decoration {
    rounding = 10
    blur {
        enabled = true
        size = 5
        passes = 2
    }
    drop_shadow = true
    shadow_range = 15
    shadow_render_power = 3
    col.shadow = rgba(00000044)
}

# Animations (Smooth & responsive)
animations {
    enabled = true
    bezier = easeOutExpo, 0.16, 1, 0.3, 1
    animation = windows, 1, 4, easeOutExpo, popin 80%
    animation = border, 1, 4, default
    animation = fade, 1, 3, default
    animation = workspaces, 1, 3, easeOutExpo
}

dwindle {
    pseudotile = true
    preserve_split = true
}

# Keybindings
$mainMod = SUPER

# Applications
bind = $mainMod, RETURN, exec, kitty
bind = $mainMod, Q, killactive,
bind = $mainMod, E, exec, thunar
bind = $mainMod, D, exec, wofi --show drun
bind = $mainMod, I, exec, coder-setup
bind = $mainMod, F, fullscreen, 0
bind = $mainMod, SPACE, togglefloating,
bind = $mainMod SHIFT, M, exit,

# Focus navigation (Arrow keys & Vim keys)
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d
bind = $mainMod, h, movefocus, l
bind = $mainMod, l, movefocus, r
bind = $mainMod, k, movefocus, u
bind = $mainMod, j, movefocus, d

# Workspaces (1-9)
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5

# Move active window to workspace
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5

# Laptop hardware keys (Volume, Brightness)
binde = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
binde = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
binde = , XF86MonBrightnessUp, exec, brightnessctl set 5%+
binde = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# Window rules
windowrulev2 = float, class:^(CoderWizard|calamares)$
windowrulev2 = center, class:^(CoderWizard|calamares)$
