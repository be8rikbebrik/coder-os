# CODER-OS Starship Prompt Configuration

format = """
[┌──](bold #38bdf8)$directory$git_branch$git_status$python$nodejs$rust$golang$docker_context
[└─>](bold #38bdf8) """

[directory]
style = "bold #38bdf8"
truncation_length = 3
truncate_to_repo = true

[git_branch]
style = "bold #f472b6"
format = " on [$symbol$branch]($style)"

[git_status]
style = "bold #f87171"
format = "([$all_status$ahead_behind]($style) )"

[python]
symbol = "🐍 "
style = "bold #facc15"
format = "via [$symbol$version]($style) "

[nodejs]
symbol = "⬢ "
style = "bold #4ade80"
format = "via [$symbol$version]($style) "

[rust]
symbol = "🦀 "
style = "bold #fb923c"
format = "via [$symbol$version]($style) "

[golang]
symbol = "🐹 "
style = "bold #38bdf8"
format = "via [$symbol$version]($style) "

[docker_context]
symbol = "🐳 "
style = "bold #0284c7"
format = "[$symbol$context]($style) "

[character]
success_symbol = "[➜](bold #22c55e)"
error_symbol = "[✗](bold #ef4444)"
