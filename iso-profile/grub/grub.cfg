# CODER-OS GRUB configuration

insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660

set default="0"
set timeout=5

search --no-floppy --set=root --label "%ARCHISO_LABEL%"

menuentry "CODER-OS 1.0 (x86_64 UEFI)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=n
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "CODER-OS 1.0 (Copy to RAM)" --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    linux /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% cow_spacesize=4G copytoram=y
    initrd /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Reboot System" {
    reboot
}

menuentry "Power Off System" {
    halt
}
