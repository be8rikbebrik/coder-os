DEFAULT coderos
PROMPT 0
TIMEOUT 50

UI vesamenu.c32

MENU TITLE CODER-OS 1.0 Live & Install (BIOS)
MENU BACKGROUND splash.png
MENU COLOR border       30;44   #40ffffff #a0000000 std
MENU COLOR title        1;36;44 #9038bdf8 #a0000000 std
MENU COLOR sel          7;37;40 #e0000000 #2038bdf8 all
MENU COLOR unsel        37;44   #50ffffff #a0000000 std
MENU COLOR help         37;40   #c0ffffff #a0000000 std

LABEL coderos
    MENU LABEL CODER-OS Live / Install (x86_64, open-source drivers)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=n cow_spacesize=4G

LABEL coderos_copytoram
    MENU LABEL CODER-OS Live (Copy to RAM)
    LINUX /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux
    INITRD /%INSTALL_DIR%/boot/intel-ucode.img,/%INSTALL_DIR%/boot/amd-ucode.img,/%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=%INSTALL_DIR% archisosearchuuid=%ARCHISO_UUID% copytoram=y cow_spacesize=4G

LABEL reboot
    MENU LABEL Reboot System
    COM32 reboot.c32

LABEL poweroff
    MENU LABEL Power Off System
    COM32 poweroff.c32
